[project]
name = "adchestra-local"
version = "0.1.0"
description = "Run Google Ads from Claude Desktop on your own computer."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-MIT-Commons-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Adchestra", email = "info@adchestra.com"}]
dependencies = ["fastmcp==4.1.0", "google-ads==33.0.0", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3", "filelock>=3.16,<4"]

[project.scripts]
adchestra-local = "adchestra_local.cli:main"

[project.urls]
Repository = "https://github.com/ShopPilot/adchestra-local"
Homepage = "https://adchestra.com"

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
